<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock Screener</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f2f4;color:#2b2f36;font:14px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:#1a62c9;text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
nav{background:#262d3d;padding:0 16px;display:flex;align-items:center;gap:20px;height:50px;position:sticky;top:0;z-index:20}
.logo{color:#fff;font-weight:700;font-size:18px;letter-spacing:-.3px}nav a{color:#c9cfdb;font-size:14px}nav a:hover,nav a.on{color:#fff;text-decoration:none}
#sw{position:relative;flex:1;max-width:420px}#q{width:100%;padding:7px 10px;border:0;border-radius:3px;font-size:14px}
#res{position:absolute;top:36px;left:0;right:0;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none;max-height:340px;overflow:auto}
#res div{padding:8px 12px;border-bottom:1px solid #eee;cursor:pointer}#res div:hover{background:#f3f6fb}#res small{color:#80868f}
main{max-width:1100px;margin:0 auto;padding:16px 12px 60px}
.card{background:#fff;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.08);padding:18px 20px;margin-bottom:14px}
h1{font-size:24px;margin:0;font-weight:600}h2{font-size:18px;font-weight:500;margin:0 0 2px}.mut{color:#80868f}.sm{font-size:13px}
.hd{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.price{font-size:26px;font-weight:600;text-align:right}.up{color:#1a8a4a}.dn{color:#d33b3b}
.ratios{display:grid;grid-template-columns:1fr 1fr;column-gap:40px;margin-top:10px}@media(max-width:700px){.ratios{grid-template-columns:1fr}}
.ratios div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eceef1}.ratios b{font-weight:500}
.btn{display:inline-block;padding:7px 14px;border:1px solid #1a62c9;color:#1a62c9;background:#fff;border-radius:3px;cursor:pointer;font-size:13.5px;margin:6px 6px 0 0}
.btn:hover{background:#eef4fd;text-decoration:none}.btn.p{background:#1a62c9;color:#fff}.btn.p:hover{background:#154fa3}
.tabs{background:#fff;position:sticky;top:50px;z-index:10;display:flex;overflow-x:auto;box-shadow:0 1px 2px rgba(0,0,0,.1);margin-bottom:14px;border-radius:4px}
.tabs a{padding:12px 16px;color:#555;white-space:nowrap;border-bottom:2px solid transparent;font-size:14px}.tabs a:hover{color:#000;text-decoration:none;border-color:#1a62c9}
.w{overflow-x:auto;margin-top:10px}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid #eceef1}th:first-child,td:first-child{text-align:left}
th{font-weight:500;color:#80868f;border-bottom:1px solid #d8dbe0}td.best{font-weight:700;color:#1a8a4a}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:24px}@media(max-width:700px){.pc{grid-template-columns:1fr}}
.pc h3{font-size:15px;margin:0 0 6px;font-weight:600}.pro h3{color:#1a8a4a}.con h3{color:#d33b3b}.pc ul{margin:0;padding-left:18px}.pc li{margin:4px 0}
.rg a{padding:3px 9px;border:1px solid #d8dbe0;border-radius:3px;margin-right:4px;color:#555;font-size:13px}.rg a.on{background:#262d3d;color:#fff;border-color:#262d3d}
.tag{display:inline-block;background:#e8edf5;border-radius:3px;padding:3px 9px;margin:0 6px 6px 0;font-size:13px}.tag i{font-style:normal;cursor:pointer;margin-left:6px;color:#d33b3b}
input.f,textarea{padding:8px 10px;border:1px solid #c8ccd2;border-radius:3px;font:inherit;width:100%}textarea{height:72px}
#mod{position:fixed;inset:0;background:rgba(20,24,34,.6);display:none;align-items:center;justify-content:center;z-index:50}
#mod .box{background:#fff;border-radius:6px;padding:24px;width:min(460px,92vw)}#mod label{display:block;margin:12px 0 4px;font-weight:500}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#262d3d;color:#fff;padding:10px 16px;border-radius:4px;display:none;max-width:90vw;z-index:60}
</style></head><body>
<nav><span class="logo">Screener</span><div id="sw"><input id="q" placeholder="Search for a company or ETF" onkeydown="if(event.key=='Enter')search()"><div id="res"></div></div>
<a id="n-co" onclick="go('co')">Company</a><a id="n-cmp" onclick="go('cmp')">Compare</a><a id="n-wl" onclick="go('wl')">Watchlist &amp; screens</a><a onclick="modal()" style="margin-left:auto">Settings</a></nav>
<main id="app"></main><div id="toast"></div>
<div id="mod"><div class="box"><h2>Connect your data server</h2>
<p class="mut sm">This site reads market data from your own Yahoo Finance server (see README steps). These values are saved only in this browser and are never part of the page source.</p>
<label>Server URL</label><input class="f" id="m-url" placeholder="https://your-app.vercel.app">
<label>Access key <span class="mut sm">(only if you set ACCESS_KEY on the server)</span></label><input class="f" id="m-key" type="password" placeholder="optional">
<p id="m-err" class="dn sm"></p><a class="btn p" onclick="saveCfg()">Save &amp; connect</a><a class="btn" onclick="$('#mod').style.display='none'">Close</a></div></div>
<script>
const $=s=>document.querySelector(s),S={};
let CFG=JSON.parse(localStorage.cfg||'{}'),view='co',cur=null,rng=365;
let cmp=JSON.parse(localStorage.cmp||'[]'),wl=JSON.parse(localStorage.wl||'[]');
const save=()=>{localStorage.cmp=JSON.stringify(cmp);localStorage.wl=JSON.stringify(wl)};
const toast=(m,ms=4000)=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.h);if(ms)t.h=setTimeout(()=>t.style.display='none',ms)};
const P=v=>{const x=parseFloat(v);return isNaN(x)?null:x};
const n=(v,d=2)=>v==null||isNaN(v)?'–':Number(v).toLocaleString('en-IN',{maximumFractionDigits:d});
const mon=d=>new Date(d).toLocaleDateString('en-GB',{month:'short',year:'numeric'});
const pc=v=>v==null?null:v*100;

/* ---------- connection popup ---------- */
function modal(){$('#m-url').value=CFG.url||'';$('#m-key').value=CFG.key||'';$('#m-err').textContent='';$('#mod').style.display='flex'}
async function saveCfg(){
  const c={url:$('#m-url').value.trim().replace(/\/+$/,''),key:$('#m-key').value.trim()};
  if(!/^https?:\/\//.test(c.url)){$('#m-err').textContent='Enter the full server URL starting with https://';return}
  try{const r=await fetch(c.url+'/api/stock?action=ping',{headers:c.key?{'X-Access-Key':c.key}:{}});
    const d=await r.json();if(!r.ok)throw new Error(d.error||'Server said '+r.status)}
  catch(e){$('#m-err').textContent='Could not connect: '+e.message;return}
  CFG=c;localStorage.cfg=JSON.stringify(c);$('#mod').style.display='none';toast('Connected')}
async function api(a,p={}){
  if(!CFG.url){modal();throw new Error('Enter your server URL first')}
  const r=await fetch(CFG.url+'/api/stock?'+new URLSearchParams({action:a,...p}),{headers:CFG.key?{'X-Access-Key':CFG.key}:{}});
  const d=await r.json();if(!r.ok)throw new Error(d.error||'Server error '+r.status);return d}

/* ---------- data ---------- */
const T=f=>{f=f||{dates:[],rows:{}};const ix=f.dates.map((_,i)=>i).reverse();
  return{d:ix.map(i=>f.dates[i]),g:(...ls)=>{const l=ls.find(x=>f.rows[x]);return ix.map(i=>l?f.rows[l][i]:null)}}};
async function load(sym){
  sym=sym.toUpperCase();if(S[sym])return S[sym];
  toast('Loading '+sym+'…',0);
  const o=await api('company',{symbol:sym});
  o.t={inc:T(o.inc),bs:T(o.bs),cf:T(o.cf),q:T(o.q)};
  o.cur=o.info.financialCurrency||o.info.currency||'USD';S[sym]=o;$('#toast').style.display='none';return o}
const sc=o=>o.cur=='INR'?1e7:1e6,unit=o=>o.cur=='INR'?'₹ Cr':o.cur+' M';
const al=(t,dates,...l)=>{const v=t.g(...l);return dates.map(d=>{const i=t.d.indexOf(d);return i<0?null:v[i]})};

function M(o){
  const i=o.info,px=o.px,last=px[px.length-1][1],prev=px.length>1?px[px.length-2][1]:null,price=i.currentPrice??i.regularMarketPrice??last;
  const y=o.t.inc.d,rev=o.t.inc.g('Total Revenue'),oi=o.t.inc.g('Operating Income','EBIT'),r0=rev.find(x=>x>0),r1=rev[rev.length-1];
  const ta=al(o.t.bs,y,'Total Assets'),cl=al(o.t.bs,y,'Current Liabilities'),k=y.length-1;
  const dr=i.dividendRate!=null&&price?i.dividendRate/price*100:pc(i.trailingAnnualDividendYield);
  return{price,chg:prev?(last/prev-1)*100:null,mcap:i.marketCap,pe:i.trailingPE,pb:i.priceToBook,evebitda:i.enterpriseToEbitda,beta:i.beta,betac:o.betaCalc,
   dy:dr,eps:i.trailingEps,bv:i.bookValue,roe:pc(i.returnOnEquity),roa:pc(i.returnOnAssets),roce:oi[k]!=null&&ta[k]?oi[k]/(ta[k]-(cl[k]||0))*100:null,
   opm:pc(i.operatingMargins),npm:pc(i.profitMargins),de:i.debtToEquity!=null?i.debtToEquity/100:null,cr:i.currentRatio,
   growth:y.length>1&&r0>0&&r1>0?(Math.pow(r1/r0,1/Math.max(1,rev.length-1-rev.indexOf(r0)))-1)*100:null,hi:i.fiftyTwoWeekHigh,lo:i.fiftyTwoWeekLow}}

const CMP=[['Price','price',0],['Market cap','mcap',0],['Stock P/E','pe',-1],['Price to book','pb',-1],['EV / EBITDA','evebitda',-1],['Beta (Yahoo)','beta',0],['Beta (calc. vs index, 2y weekly)','betac',0],['Dividend yield %','dy',1],['EPS','eps',1],['ROE %','roe',1],['ROCE %','roce',1],['ROA %','roa',1],['Operating margin %','opm',1],['Net margin %','npm',1],['Debt to equity','de',-1],['Current ratio','cr',1],['Sales CAGR %','growth',1],['52 week high','hi',0],['52 week low','lo',0]];
const INC=[['Sales','Total Revenue'],['Cost of revenue','Cost Of Revenue'],['Gross profit','Gross Profit'],['Operating profit','Operating Income','EBIT'],['EBITDA','EBITDA','Normalized EBITDA'],['Interest','Interest Expense'],['Profit before tax','Pretax Income'],['Tax','Tax Provision'],['Net profit','Net Income'],['EPS (diluted)','Diluted EPS']];
const BS=[['Total assets','Total Assets'],['Current assets','Current Assets'],['Inventory','Inventory'],['Receivables','Accounts Receivable','Receivables'],['Cash & equivalents','Cash And Cash Equivalents'],['Total liabilities','Total Liabilities Net Minority Interest'],['Current liabilities','Current Liabilities'],['Payables','Accounts Payable','Payables'],['Borrowings','Total Debt'],['Equity','Stockholders Equity','Common Stock Equity']];
const CF=[['Cash from operating activity','Operating Cash Flow'],['Cash from investing activity','Investing Cash Flow'],['Cash from financing activity','Financing Cash Flow'],['Capex','Capital Expenditure'],['Free cash flow','Free Cash Flow'],['Dividends paid','Cash Dividends Paid']];
const QR=[['Sales','Total Revenue'],['Operating profit','Operating Income','EBIT'],['Interest','Interest Expense'],['Profit before tax','Pretax Income'],['Net profit','Net Income'],['EPS (diluted)','Diluted EPS']];

function RAT(o){
  const y=o.t.inc.d,I=(...l)=>o.t.inc.g(...l),B=(...l)=>al(o.t.bs,y,...l),C=(...l)=>al(o.t.cf,y,...l);
  const rev=I('Total Revenue'),cogs=I('Cost Of Revenue'),oi=I('Operating Income','EBIT'),ni=I('Net Income'),intr=I('Interest Expense'),
   ta=B('Total Assets'),eq=B('Stockholders Equity','Common Stock Equity'),cl=B('Current Liabilities'),ca=B('Current Assets'),debt=B('Total Debt'),
   rc=B('Accounts Receivable','Receivables'),inv=B('Inventory'),pay=B('Accounts Payable','Payables'),ocf=C('Operating Cash Flow'),fcf=C('Free Cash Flow');
  const f=(a,b,k=1)=>a!=null&&b?a/b*k:null,m=fn=>y.map((_,i)=>fn(i));
  const dd=m(i=>f(rc[i],rev[i],365)),di=m(i=>f(inv[i],cogs[i],365)),dp=m(i=>f(pay[i],cogs[i],365));
  return[['Sales growth %',m(i=>i?f(rev[i]-rev[i-1],rev[i-1],100):null)],['Gross margin %',m(i=>f(rev[i]-cogs[i],rev[i],100))],['Operating margin %',m(i=>f(oi[i],rev[i],100))],['Net margin %',m(i=>f(ni[i],rev[i],100))],
   ['ROE %',m(i=>f(ni[i],eq[i],100))],['ROCE %',m(i=>f(oi[i],ta[i]-(cl[i]||0),100))],['Debt to equity',m(i=>f(debt[i],eq[i]))],['Current ratio',m(i=>f(ca[i],cl[i]))],
   ['Interest coverage',m(i=>f(oi[i],Math.abs(intr[i])))],['Asset turnover',m(i=>f(rev[i],ta[i]))],['Debtor days',dd],['Inventory days',di],['Days payable',dp],
   ['Cash conversion cycle',m(i=>dd[i]!=null&&di[i]!=null&&dp[i]!=null?dd[i]+di[i]-dp[i]:null)],['Free cash flow',fcf],['Operating cash flow / net profit',m(i=>f(ocf[i],ni[i]))]]}

/* ---------- pieces ---------- */
function chart(series,days){
  const W=760,H=240,cut=new Date(Date.now()-days*864e5).toISOString().slice(0,10);
  const S2=series.map(s=>{let p=s.px.filter(x=>x[0]>=cut&&x[1]!=null);if(s.reb&&p.length){const b=p[0][1];p=p.map(x=>[x[0],x[1]/b*100])}return{n:s.n,p}});
  const all=S2.flatMap(s=>s.p.map(x=>x[1]));if(!all.length)return'<p class="mut">No price data.</p>';
  const lo=Math.min(...all),hi=Math.max(...all),col=['#1a62c9','#d33b3b','#e08a00','#1a8a4a','#7a4bc9'];
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%"><g stroke="#eceef1">${[0,1,2,3,4].map(i=>`<line x1="40" x2="${W}" y1="${10+i*55}" y2="${10+i*55}"/>`).join('')}</g>`+
   [0,1,2,3,4].map(i=>`<text x="0" y="${14+i*55}" font-size="11" fill="#80868f">${n(hi-(hi-lo)*i/4,0)}</text>`).join('')+
   S2.map((s,k)=>`<polyline fill="none" stroke="${col[k%5]}" stroke-width="1.6" points="${s.p.map((x,i)=>`${(40+i/(s.p.length-1||1)*(W-40)).toFixed(1)},${(H-20-(x[1]-lo)/(hi-lo||1)*(H-30)).toFixed(1)}`).join(' ')}"/>`).join('')+'</svg>'+
   (S2.length>1?S2.map((s,k)=>`<span class="tag" style="border-left:4px solid ${col[k%5]}">${s.n}</span>`).join(''):'')}
const rangeBar=()=>`<div class="rg">${[['1M',30],['6M',182],['1Y',365],['3Y',1095],['5Y',1825]].map(([l,d])=>`<a class="${rng==d?'on':''}" onclick="rng=${d};render()">${l}</a>`).join('')}</div>`;

function tbl(o,t,rows,title,u=true){
  const sc_=sc(o),rs=rows.filter(([l,...a])=>t.g(...a).some(x=>x!=null));
  if(!rs.length)return`<h2>${title}</h2><p class="mut">Not available for this security.</p>`;
  return`<h2>${title}</h2>${u?`<div class="mut sm">Consolidated figures in ${unit(o)}</div>`:''}<div class="w"><table><tr><th></th>${t.d.map(d=>`<th>${mon(d)}</th>`).join('')}</tr>`+
   rs.map(([l,...a])=>`<tr><td>${l}</td>${t.g(...a).map(x=>`<td>${l.startsWith('EPS')?n(x):n(x==null?null:x/sc_,0)}</td>`).join('')}</tr>`).join('')+
   (rows===QR&&t.g('Total Revenue').some(x=>x)?`<tr><td>OPM %</td>${t.g('Total Revenue').map((r,i)=>`<td>${n(t.g('Operating Income','EBIT')[i]/r*100,0)}%</td>`).join('')}</tr>`:'')+'</table></div>'}

function proscons(o){
  const m=M(o),pr=[],co=[],a=(c,s,x)=>{if(c)(x?co:pr).push(s)};
  a(m.roe>15,`Company has a good return on equity (ROE) of ${n(m.roe,1)}%.`);a(m.roce>15,`Good return on capital employed of ${n(m.roce,1)}%.`);a(m.de!=null&&m.de<.5,`Company is almost debt free (debt to equity ${n(m.de)}).`);
  a(m.growth>10,`Sales have grown at ${n(m.growth,1)}% a year over the period shown.`);a(m.npm>15,`Healthy net margin of ${n(m.npm,1)}%.`);a(m.dy>2,`Pays a dividend yield of ${n(m.dy,1)}%.`);a(m.cr>1.5,`Comfortable current ratio of ${n(m.cr)}.`);
  a(m.pe>40,`Stock is trading at a high P/E of ${n(m.pe,1)}.`,1);a(m.de>1.5,`Company has high debt (debt to equity ${n(m.de)}).`,1);a(m.growth<0,`Sales have shrunk (${n(m.growth,1)}% a year).`,1);
  a(m.npm!=null&&m.npm<5,`Net margin is low at ${n(m.npm,1)}%.`,1);a(m.roe!=null&&m.roe<8,`Poor return on equity of ${n(m.roe,1)}%.`,1);a(m.cr!=null&&m.cr<1,`Current ratio is below 1 (${n(m.cr)}).`,1);a(m.beta>1.3,`Stock is more volatile than the market (beta ${n(m.beta)}).`,1);
  const li=x=>x.length?x.map(s=>`<li>${s}</li>`).join(''):'<li class="mut">Nothing flagged on the data available.</li>';
  return`<div class="pc"><div class="pro"><h3>Pros</h3><ul>${li(pr)}</ul></div><div class="con"><h3>Cons</h3><ul>${li(co)}</ul></div></div>`}

function company(o){
  const m=M(o),i=o.info,cu=i.currency||o.cur,mc=m.mcap?(cu=='INR'?'₹ '+n(m.mcap/1e7,0)+' Cr.':n(m.mcap/1e9,2)+' B '+cu):'–';
  const R=[['Market cap',mc],['Current price',n(m.price)],['High / low',n(m.hi,0)+' / '+n(m.lo,0)],['Stock P/E',n(m.pe)],['Book value',n(m.bv)],['Dividend yield',n(m.dy)+' %'],['ROCE',n(m.roce)+' %'],['ROE',n(m.roe)+' %'],
   ['Beta',n(m.beta)],['Beta (calculated)',n(m.betac)],['EPS',n(m.eps)],['Price to book',n(m.pb)],['EV / EBITDA',n(m.evebitda)],['Debt to equity',n(m.de)],['Current ratio',n(m.cr)],['Net margin',n(m.npm)+' %']];
  const ins=pc(i.heldPercentInsiders),inst=pc(i.heldPercentInstitutions),pub=ins!=null&&inst!=null?100-ins-inst:null;
  return`<div class="card"><div class="hd"><div><h1>${i.longName||i.shortName||o.sym}</h1><div class="mut sm">${o.sym}${i.fullExchangeName?' · '+i.fullExchangeName:''}${i.sector?' · '+i.sector:''}${i.industry?' · '+i.industry:''}</div>
  ${i.website?`<div class="sm"><a href="${i.website}" target="_blank" rel="noopener">${i.website.replace(/^https?:\/\//,'')}</a></div>`:''}</div>
  <div><div class="price">${cu=='INR'?'₹ ':''}${n(m.price)}</div><div class="${m.chg>=0?'up':'dn'}" style="text-align:right">${m.chg!=null?(m.chg>=0?'+':'')+n(m.chg)+'%':''}</div></div></div>
  <div><a class="btn" onclick="toggleWl('${o.sym}')">${wl.includes(o.sym)?'Remove from watchlist':'Add to watchlist'}</a><a class="btn" onclick="toggleCmp('${o.sym}')">${cmp.includes(o.sym)?'Remove from compare':'Add to compare'}</a><a class="btn p" onclick="xl([S['${o.sym}']])">Export to Excel</a></div>
  ${i.longBusinessSummary?`<p class="sm mut" style="margin-bottom:0">${i.longBusinessSummary.slice(0,420)}…</p>`:''}
  <div class="ratios">${R.map(([k,v])=>`<div><span class="mut">${k}</span><b>${v}</b></div>`).join('')}</div></div>
  <div class="tabs">${['chart:Chart','pros:Pros & cons','quarters:Quarters','pl:Profit & loss','bs:Balance sheet','cf:Cash flow','ratios:Ratios','holding:Shareholding'].map(x=>{const[a,b]=x.split(':');return`<a onclick="document.getElementById('${a}').scrollIntoView({behavior:'smooth',block:'start'});scrollBy(0,-110)">${b}</a>`}).join('')}</div>
  <div class="card" id="chart"><h2>Price</h2>${rangeBar()}${chart([{n:o.sym,px:o.px}],rng)}</div>
  <div class="card" id="pros">${proscons(o)}</div>
  <div class="card" id="quarters">${tbl(o,o.t.q,QR,'Quarterly results')}</div>
  <div class="card" id="pl">${tbl(o,o.t.inc,INC,'Profit & loss')}</div>
  <div class="card" id="bs">${tbl(o,o.t.bs,BS,'Balance sheet')}</div>
  <div class="card" id="cf">${tbl(o,o.t.cf,CF,'Cash flows')}</div>
  <div class="card" id="ratios"><h2>Ratios</h2><div class="w"><table><tr><th></th>${o.t.inc.d.map(d=>`<th>${mon(d)}</th>`).join('')}</tr>${RAT(o).map(([l,a])=>`<tr><td>${l}</td>${a.map(z=>`<td>${l=='Free cash flow'?n(z==null?null:z/sc(o),0):n(z)}</td>`).join('')}</tr>`).join('')}</table></div></div>
  <div class="card" id="holding"><h2>Shareholding pattern</h2>${ins==null&&inst==null?'<p class="mut">Not available.</p>':`<div class="w"><table><tr><th></th><th>Holding %</th></tr><tr><td>Promoters / insiders</td><td>${n(ins)}</td></tr><tr><td>Institutions</td><td>${n(inst)}</td></tr><tr><td>Public and others</td><td>${n(pub)}</td></tr></table></div>`}</div>`}

const welcome=()=>`<div class="card"><h1>Stock analysis and screening</h1><p class="mut">Search any listed company or ETF. Yahoo symbols: NSE stocks end in <b>.NS</b> (RELIANCE.NS), BSE in <b>.BO</b> (TCS.BO), US tickers are plain (AAPL, SPY).</p>
 ${['RELIANCE.NS','TCS.NS','HINDUNILVR.NS','NIFTYBEES.NS','AAPL','SPY'].map(s=>`<a class="btn" onclick="openCo('${s}')">${s}</a>`).join('')}</div>`;

function compare(){
  const L=cmp.map(s=>S[s]).filter(Boolean);
  let h=`<div class="card"><h2>Compare</h2><div style="margin-top:8px">${cmp.map(s=>`<span class="tag">${s}<i onclick="toggleCmp('${s}')">×</i></span>`).join('')||'<span class="mut">No companies added yet.</span>'}</div>
  <div style="display:flex;gap:8px;margin-top:8px"><input class="f" id="ci" style="max-width:300px" placeholder="Add symbol, e.g. MSFT or TCS.NS" onkeydown="if(event.key=='Enter')addC()"><a class="btn p" style="margin:0" onclick="addC()">Add</a>${L.length?`<a class="btn" style="margin:0" onclick="xl(cmp.map(s=>S[s]).filter(Boolean))">Download Excel report</a>`:''}</div></div>`;
  if(!L.length)return h;
  const ms=L.map(M),lead={};L.forEach(o=>lead[o.sym]=0);
  const rows=CMP.map(([l,k,d])=>{const v=ms.map(m=>m[k]);let b=-1;
    if(d&&L.length>1){const ok=v.map((x,i)=>[x,i]).filter(([x])=>x!=null&&(d>0||x>0));if(ok.length>1){b=ok.reduce((a,c)=>(d>0?c[0]>a[0]:c[0]<a[0])?c:a)[1];lead[L[b].sym]++}}
    return`<tr><td>${l}</td>${v.map((x,i)=>`<td class="${i==b?'best':''}">${n(x,k=='mcap'?0:2)}</td>`).join('')}</tr>`}).join('');
  h+=`<div class="card"><div class="w"><table><tr><th></th>${L.map(o=>`<th>${o.sym}</th>`).join('')}</tr>${rows}</table></div>
  <p class="mut sm">Bold green marks the better value for that ratio. Leads: ${L.map(o=>o.sym+' '+lead[o.sym]).join(', ')}. Market cap and price are in each stock's own currency.</p></div>
  <div class="card"><h2>Price performance (rebased to 100)</h2>${rangeBar()}${chart(L.map(o=>({n:o.sym,px:o.px,reb:1})),rng)}</div>`;
  ['Sales growth %','Operating margin %','Net margin %','ROE %','ROCE %','Debt to equity','Current ratio','Cash conversion cycle'].forEach(lb=>{
    h+=`<div class="card"><div class="w"><table><tr><th>${lb}</th><th>Latest year</th><th>Previous</th><th>2 years ago</th></tr>${L.map(o=>{const a=RAT(o).find(r=>r[0]==lb)[1].slice().reverse();return`<tr><td>${o.sym}</td>${[0,1,2].map(i=>`<td>${n(a[i])}</td>`).join('')}</tr>`}).join('')}</table></div></div>`});
  return h}

function watch(){
  return`<div class="card"><h2>Watchlist</h2><div style="margin-top:8px">${wl.map(s=>`<span class="tag"><a onclick="openCo('${s}')">${s}</a><i onclick="toggleWl('${s}')">×</i></span>`).join('')||'<span class="mut">Empty. Open a company and choose Add to watchlist.</span>'}</div></div>
  <div class="card"><h2>Custom screen</h2><p class="mut sm">Write a query like on screener.in and run it over your watchlist.</p><textarea id="sq">${localStorage.sq||'pe < 30 AND roe > 15 AND beta < 1.3'}</textarea>
  <p class="mut sm">Fields: price, mcap (billions), pe, pb, evebitda, beta, dy, eps, roe, roa, roce, opm, npm, de, cr, growth. Operators: &gt; &lt; &gt;= &lt;= =. Join with AND.</p><a class="btn p" onclick="runScreen()" style="margin:0">Run this query</a><div id="sr"></div></div>`}
async function runScreen(){
  const q=$('#sq').value;localStorage.sq=q;const cs=[...q.toLowerCase().matchAll(/(\w+)\s*(>=|<=|>|<|=)\s*(-?[\d.]+)/g)];
  for(const s of wl)try{await load(s)}catch(e){toast(s+': '+e.message,6000)}
  const ok=wl.filter(s=>S[s]).map(s=>[s,M(S[s])]).filter(([s,m])=>cs.every(([,k,op,v])=>{let x=k=='mcap'?m.mcap/1e9:m[k];v=+v;if(x==null)return false;return op=='>'?x>v:op=='<'?x<v:op=='>='?x>=v:op=='<='?x<=v:x==v}));
  $('#sr').innerHTML=ok.length?`<div class="w"><table><tr><th>Name</th><th>Price</th><th>P/E</th><th>ROE %</th><th>ROCE %</th><th>Beta</th><th>Net margin %</th></tr>${ok.map(([s,m])=>`<tr><td><a onclick="openCo('${s}')">${s}</a></td><td>${n(m.price)}</td><td>${n(m.pe)}</td><td>${n(m.roe,1)}</td><td>${n(m.roce,1)}</td><td>${n(m.beta)}</td><td>${n(m.npm,1)}</td></tr>`).join('')}</table></div>`:'<p class="mut">No company in your watchlist matches.</p>'}

/* ---------- navigation ---------- */
function render(){['co','cmp','wl'].forEach(v=>$('#n-'+v).classList.toggle('on',v==view));
  $('#app').innerHTML=view=='co'?(cur?company(S[cur]):welcome()):view=='cmp'?compare():watch()}
const go=v=>{view=v;render()};
async function search(){
  const q=$('#q').value.trim();if(!q)return;toast('Searching…',0);
  try{const r=await api('search',{q});$('#toast').style.display='none';const R=$('#res');R.style.display='block';
    R.innerHTML=r.map(x=>`<div onclick="openCo('${x.symbol}')"><b>${x.name||x.symbol}</b> <small>${x.symbol} · ${x.exch||''} · ${x.type}</small></div>`).join('')||'<div>No matches. Try a symbol such as RELIANCE.NS</div>'}
  catch(e){toast(e.message,8000)}}
document.addEventListener('click',e=>{if(!e.target.closest('#sw'))$('#res').style.display='none'});
async function openCo(s){$('#res').style.display='none';try{await load(s);cur=s.toUpperCase();view='co';render();scrollTo(0,0)}catch(e){toast(e.message,8000)}}
const toggleWl=s=>{wl=wl.includes(s)?wl.filter(x=>x!=s):[...wl,s];save();render()};
const toggleCmp=s=>{cmp=cmp.includes(s)?cmp.filter(x=>x!=s):[...cmp,s];save();render()};
async function addC(){const s=$('#ci').value.trim().toUpperCase();if(!s)return;try{await load(s);if(!cmp.includes(s))cmp.push(s);save();render()}catch(e){toast(e.message,8000)}}

/* ---------- Excel export ---------- */
function xl(L){
  const wb=XLSX.utils.book_new(),A=(nm,a)=>{const ws=XLSX.utils.aoa_to_sheet(a);ws['!cols']=[{wch:44},...Array(40).fill({wch:13})];XLSX.utils.book_append_sheet(wb,ws,nm)};
  A('Cover',[['Stock analysis report'],[L.map(o=>o.info.longName||o.sym).join(' vs ')],[],['Source','Yahoo Finance via yfinance (annual and quarterly statements, quotes, prices)'],['Generated',new Date().toISOString().slice(0,10)],['Units',L.map(o=>o.sym+': '+unit(o)).join(' | ')],['Note','For learning only. Not investment, financial or professional advice.']]);
  const ms=L.map(M);
  A('Overview',[['Metric',...L.map(o=>o.sym),'Leader'],...CMP.map(([l,k,d])=>{const v=ms.map(m=>m[k]);let w='';
    if(d&&L.length>1){const ok=v.map((x,i)=>[x,i]).filter(([x])=>x!=null&&(d>0||x>0));if(ok.length>1)w=L[ok.reduce((a,c)=>(d>0?c[0]>a[0]:c[0]<a[0])?c:a)[1]].sym}
    return[l,...v.map(x=>x==null?'':+x.toFixed(2)),w]})]);
  [['Profit & Loss','inc',INC],['Quarterly Results','q',QR],['Balance Sheet','bs',BS],['Cash Flow','cf',CF]].forEach(([nm,k,R])=>{
    const w=Math.max(...L.map(o=>o.t[k].d.length)),h1=[nm+' (₹ Cr for INR, millions otherwise)'],h2=['Particular'];
    L.forEach(o=>{for(let i=0;i<w;i++){h1.push(i?'':o.sym);h2.push(o.t[k].d[i]?mon(o.t[k].d[i]):'')}h1.push('');h2.push('')});
    A(nm,[h1,h2,...R.map(([l,...a])=>[l,...L.flatMap(o=>{const v=o.t[k].g(...a);return[...Array(w).fill(0).map((_,i)=>v[i]==null?'':+(l.startsWith('EPS')?v[i]:v[i]/sc(o)).toFixed(2)),'']})])])});
  const w=Math.max(...L.map(o=>o.t.inc.d.length)),h1=['Ratios'],h2=['Ratio'],rs=L.map(RAT);
  L.forEach(o=>{for(let i=0;i<w;i++){h1.push(i?'':o.sym);h2.push(o.t.inc.d[i]?mon(o.t.inc.d[i]):'')}h1.push('');h2.push('')});
  A('Ratios',[h1,h2,...rs[0].map(([l],j)=>[l,...rs.flatMap((r,x)=>[...Array(w).fill(0).map((_,i)=>{const z=r[j][1][i];return z==null?'':+(l=='Free cash flow'?z/sc(L[x]):z).toFixed(2)}),''])])]);
  XLSX.writeFile(wb,L.map(o=>o.sym.replace(/\W/g,'_')).join('_vs_')+'_Report.xlsx')}

render();if(!CFG.url)modal();
</script></body></html>
